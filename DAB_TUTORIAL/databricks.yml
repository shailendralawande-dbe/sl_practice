bundle:
  name: DAB_TUTORIAL
  uuid: 0f6ad6ec-88d7-4436-afdb-d183ec80b999

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: dbc-980fbe6c-f506.cloud.databricks.com
    variables:
      catalog: databrickssl
      schema: ${workspace.current_user.short_name}
    permissions:
      - group_name: admins
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: dbc-980fbe6c-f506.cloud.databricks.com
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: databrickssl
      schema: prod
    permissions:
      - user_name: nilendralawande@gmail.com
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_RUN
